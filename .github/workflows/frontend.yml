#kics-scan disable=baee238e-1921-4801-9c3f-79ae1d7b2cbc
name: Frontend Build & Deploy

on:
  push:
    # Only run this workflow if changes are made to the frontend code or the workflow file
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

# Permissions required for the workflow to run
permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      CLOUDFRONT_DIST_ID: ${{ secrets.CLOUDFRONT_DIST_ID }}
    steps:
      - uses: actions/checkout@v4
        name: Checkout code

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clean install dependencies
        run: |
          cd frontend
          npm install

      # Build the React app for production and output to frontend/build directory
      - name: Build
        run: |
            cd frontend
            npm run build
      # Verify the build output and S3 bucket existence
      - name: Verify build output
        run: |
            if [ ! -d "frontend/build" ]; then
                echo "Build output directory does not exist!"
                exit 1
            fi
            if [ ! -f "frontend/build/index.html" ]; then
                echo "index.html not found in build output!"
                exit 1
            fi
            echo "Build output verified successfully."
      # Check if the S3 bucket exists
      - name: Verify S3 bucket
        run: |
          if ! aws s3api head-bucket --bucket $S3_BUCKET; then
              echo "S3 bucket $S3_BUCKET does not exist!"
              exit 1
          fi
          echo "S3 bucket $S3_BUCKET exists."

    # Sync the build output to the S3 bucket and invalidate CloudFront cache
      - name: Deploy to S3
        run: |
          aws s3 sync frontend/build s3://$S3_BUCKET --delete

    # Invalidate CloudFront cache to ensure the latest content is served
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DIST_ID --paths "/*"
